[workspace]
resolver = "3"
members = ["crates/pet-expr"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/yrbane/rustypet"

[workspace.dependencies]
thiserror = "2"
rand = "0.9"
quick-xml = "0.37"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
insta = "1"
